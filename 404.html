// Check if this path should be redirected
if (redirectMap[currentPath]) {
  const newUrl = redirectMap[currentPath];

  // Show redirect message
  document.getElementById('redirect-message').style.display = 'block';
  document.getElementById('not-found-message').style.display = 'none';
  const isExternal = newUrl.startsWith('http');
  document.getElementById('new-url').textContent = 'New URL: ' + (isExternal ? newUrl : window.location.origin + newUrl);

  // Redirect after a short delay to show the message
  setTimeout(() => {
    window.location.href = isExternal ? newUrl : newUrl;

} else {
