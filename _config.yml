title: Leonardo Flores
description: "Leader, Scholar, Educator, Creator."
url: "https://leonardoflores.net"
baseurl: ""

# Build
markdown: kramdown
highlighter: rouge
future: true

# Pagination (disabled globally, enabled per-page)
pagination:
  enabled: false
  per_page: 12
  permalink: "/blog/page-:num/"
  title: ":title"
  sort_field: "date"
  sort_reverse: true

# Category display names (slug -> display)
category_names:
  news: "News"
  presentations: "Presentations"
  creative-work: "Creative Work"
  teaching: "Teaching"
  resources: "Resources"
  en-espanol: "En Español"

# Plugins
plugins:
  - jekyll-paginate-v2
  - jekyll-feed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.py"
  - all_posts.json
  - all_posts_cards.json
  - all_posts_full.json
  - posts-data.json
  - convert_to_jekyll.py
  - README.md
  - vendor
