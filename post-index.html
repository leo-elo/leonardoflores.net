---
layout: default
title: "Index - Leonardo Flores"
---
<style>
    .post-index {
        list-style: none;
        padding: 0;
        margin: 2rem 0;
    }
    .post-index-item {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--color-accent);
        flex-wrap: wrap;
        gap: 0.5rem;
    }
    .post-index-link {
        color: var(--color-primary);
        text-decoration: none;
        font-weight: 500;
        font-family: var(--font-heading);
        font-size: 1.1rem;
    }
    .post-index-link:hover {
        text-decoration: underline;
    }
    .post-index-date {
        color: var(--color-text-light);
        font-size: 0.9rem;
        white-space: nowrap;
    }
    .post-count {
        color: var(--color-text-light);
        font-size: 0.95rem;
        margin-bottom: 1rem;
    }
</style>

<p class="post-count">{{ site.posts.size }} posts total, sorted by date (newest first)</p>

<ul class="post-index">
    {% for post in site.posts %}
    <li class="post-index-item">
        <a href="{{ post.url | relative_url }}" class="post-index-link">{{ post.title }}</a>
        <span class="post-index-date">{{ post.date | date: "%B %-d, %Y" }}</span>
    </li>
    {% endfor %}
</ul>
