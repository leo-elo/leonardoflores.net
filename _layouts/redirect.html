<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  <meta http-equiv="refresh" content="4;url={{ page.redirect_to }}">
  <style>
    .redirect-container { max-width: 680px; margin: 6rem auto; padding: 0 1.5rem; text-align: center; }
    .redirect-label { font-size: .8rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--color-text-light); margin-bottom: 1rem; }
    .redirect-container h1 { font-family: var(--font-heading); font-size: 2.2rem; color: var(--color-primary); margin-bottom: .5rem; }
    .redirect-course { font-family: var(--font-heading); font-size: 1.3rem; color: var(--color-text-light); margin-bottom: 2rem; }
    .redirect-message { font-size: 1rem; line-height: 1.7; color: var(--color-text-light); margin-bottom: 2rem; }
    .redirect-btn { display: inline-block; padding: 12px 32px; background: var(--color-primary); color: #fff; text-decoration: none; border-radius: 4px; font-weight: 600; font-size: 1rem; }
    .redirect-btn:hover { background: #000; color: #fff; }
    .redirect-note { margin-top: 1.5rem; font-size: .9rem; color: var(--color-text-light); }
    .redirect-note a { color: var(--color-text-light); }
  </style>
</head>
<body>
  {% include header.html %}
  <div class="redirect-container">
    <p class="redirect-label">Page Has Moved</p>
    <h1>You are being redirected</h1>
    <p class="redirect-course">{{ page.title }}</p>
    <p class="redirect-message">This page has a new home. You will be taken there automatically in <strong><span id="s">4</span> seconds</strong>.</p>
    <a class="redirect-btn" href="{{ page.redirect_to }}">Go Now &rarr;</a>
    <p class="redirect-note">Or <a href="{{ '/courses.html' | relative_url }}">browse all course sites</a>.</p>
  </div>
  {% include footer.html %}
  <script>
    var n=4, el=document.getElementById('s');
    setInterval(function(){ n--; if(el) el.textContent=n; if(n<=0) window.location.href='{{ page.redirect_to }}'; }, 1000);
  </script>
</body>
</html>
