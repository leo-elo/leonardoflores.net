<!DOCTYPE html>
<html lang="en">
<head>
    {% include head.html %}
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
        }

        /* Hide tagline on landing page only */
        .tagline {
            display: none;
        }

        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 100px);
            padding: 0;
            position: relative;
        }

        .image-accordion-wrapper {
            position: relative;
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .landing-image {
            max-width: 100%;
            max-height: calc(100vh - 150px);
            height: auto;
            width: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: var(--global--elevation-large);
        }

        .accordion-labels {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 2rem;
            z-index: 10;
        }

        .accordion-label {
            font-family: var(--font-heading);
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
            user-select: none;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            text-decoration: none;
        }

        .accordion-label:hover {
            color: #FDE801;
            transform: translateX(10px);
        }

        @media (max-width: 1024px) {
            .accordion-labels {
                left: 3%;
                gap: 1.5rem;
            }

            .accordion-label {
                font-size: 2.5rem;
            }

            .landing-image {
                max-height: calc(100vh - 200px);
            }
        }

        @media (max-width: 768px) {
            .image-accordion-wrapper {
                flex-direction: column;
            }

            .accordion-labels {
                position: static;
                transform: none;
                flex-direction: row;
                justify-content: center;
                gap: clamp(0.4rem, 2vw, 1rem);
                margin-top: 1rem;
                order: 2;
            }

            .accordion-label {
                font-size: clamp(0.85rem, 4.5vw, 1.5rem);
            }

            .accordion-label:hover {
                transform: translateY(-5px);
            }

            .landing-image {
                max-height: 50vh;
                order: 1;
            }
        }
    </style>
</head>
<body>
    {% include header.html %}

    <div class="landing-container">
        <div class="image-accordion-wrapper">
            <div class="accordion-labels">
                <a class="accordion-label" href="{{ '/leader.html' | relative_url }}">Leader</a>
                <a class="accordion-label" href="{{ '/blog.html' | relative_url }}">Scholar</a>
                <a class="accordion-label" href="{{ '/courses/' | relative_url }}">Educator</a>
                <a class="accordion-label" href="{{ '/creator.html' | relative_url }}">Creator</a>
            </div>
            <img src="{{ '/images/cyberleo2026.png' | relative_url }}" alt="Leonardo Flores" class="landing-image">
        </div>
    </div>

    {% include footer.html %}

    <script src="{{ '/js/search.js' | relative_url }}"></script>
</body>
</html>
